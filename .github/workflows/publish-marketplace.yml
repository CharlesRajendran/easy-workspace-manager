name: Manual Marketplace Promotion

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git release tag to publish to Marketplace (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Promote Release to VS Code Marketplace
    runs-on: ubuntu-latest
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/
    steps:
      - name: Checkout Code at Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath *.vsix -p "$VSCE_PAT"
