name: Release & Marketplace Publish

on:
  push:
    # Only formal semantic version tags (e.g., v1.0.0, v2.1.3). Excludes dev/alpha/beta tags.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish_to_marketplace:
        description: 'Submit for Marketplace publication (requires environment approval)?'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Quality checks & compile
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: "*.vsix"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Step 2: Publish GitHub Release (with .vsix attachment)
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const tag = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            let notes = "";
            if (fs.existsSync("CHANGELOG.md")) {
              const text = fs.readFileSync("CHANGELOG.md", "utf8");
              const lines = text.split("\n");
              let capturing = false;
              const collected = [];
              for (const line of lines) {
                if (/^#{1,3}\s+(?:\[|\d)/.test(line)) {
                  if (line.includes(tag)) {
                    capturing = true;
                    continue;
                  } else if (capturing) {
                    break;
                  }
                }
                if (capturing) {
                  collected.push(line);
                }
              }
              notes = collected.join("\n").trim();
            }
            if (!notes) {
              notes = `Release ${process.env.GITHUB_REF_NAME}`;
            }
            fs.writeFileSync("RELEASE_NOTES.md", notes);
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: "*.vsix"

  # ---------------------------------------------------------------------------
  # Step 3: Publish to VS Code Marketplace (Gated by Environment Approval)
  # ---------------------------------------------------------------------------
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: [build-and-test, github-release]
    runs-on: ubuntu-latest
    # Manual Approval Gate: Requires reviewer approval configured in GitHub Settings -> Environments -> marketplace
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/
    # Only runs if triggered by a release tag OR if explicitly enabled via manual dispatch
    if: github.event_name == 'push' || github.event.inputs.publish_to_marketplace == true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Publish to Marketplace via VSCE
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath *.vsix -p "$VSCE_PAT"
